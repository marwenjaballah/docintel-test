apiVersion: apps/v1
kind: Deployment
metadata:
  name: docintel-api
  namespace: docintel
  labels:
    app: docintel-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docintel-api
  template:
    metadata:
      labels:
        app: docintel-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: docintel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: docintel-config
            - secretRef:
                name: docintel-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: docintel-api
  namespace: docintel
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: docintel-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docintel-worker
  namespace: docintel
  labels:
    app: docintel-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docintel-worker
  template:
    metadata:
      labels:
        app: docintel-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: docintel:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "-c", "2"]
          envFrom:
            - configMapRef:
                name: docintel-config
            - secretRef:
                name: docintel-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docintel-api-hpa
  namespace: docintel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docintel-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
